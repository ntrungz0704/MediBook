<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <radialGradient id="heroDocGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Soft Backdrop Aura -->
  <circle cx="300" cy="300" r="280" fill="url(#heroDocGlow)" />
  
  <!-- Torso & Coat -->
  <path d="M140 650 L160 380 Q300 340 440 380 L460 650 Z" fill="#ffffff" filter="url(#cardShadow)" />
  <path d="M298 380 L298 650" stroke="#e2e8f0" stroke-width="3" />
  
  <!-- Inner shirt collar -->
  <polygon points="260,370 300,430 340,370" fill="#0284c7" />
  
  <!-- Stethoscope -->
  <path d="M210 380 Q200 500 270 515 Q340 500 340 380" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round" />
  <circle cx="270" cy="525" r="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="5" />
  
  <!-- Green Medical Clipboard held in hand -->
  <rect x="330" y="420" width="160" height="220" rx="14" fill="#0f766e" transform="rotate(-8 330 420)" filter="url(#cardShadow)" />
  <rect x="345" y="440" width="130" height="180" rx="8" fill="#f8fafc" transform="rotate(-8 330 420)" />
  <!-- Clipboard clip -->
  <rect x="385" y="415" width="50" height="20" rx="4" fill="#cbd5e1" transform="rotate(-8 330 420)" />
  
  <!-- Neck -->
  <rect x="265" y="300" width="70" height="75" fill="#fde68a" rx="12" />
  
  <!-- Female Doctor Face -->
  <ellipse cx="300" cy="220" rx="80" ry="95" fill="#fef08a" />
  
  <!-- Hair: Asian Doctor Style -->
  <path d="M200 200 Q200 90 300 80 Q400 90 400 200 Q360 140 300 140 Q240 140 200 200 Z" fill="#0f172a" />
  <path d="M190 200 Q180 340 210 400 Q240 400 230 310 Q215 240 215 200 Z" fill="#0f172a" />
  <path d="M410 200 Q420 340 390 400 Q360 400 370 310 Q385 240 385 200 Z" fill="#0f172a" />
  
  <!-- Eyes -->
  <ellipse cx="265" cy="205" rx="7" ry="8" fill="#0f172a" />
  <ellipse cx="335" cy="205" rx="7" ry="8" fill="#0f172a" />
  <circle cx="267" cy="203" r="2.5" fill="#ffffff" />
  <circle cx="337" cy="203" r="2.5" fill="#ffffff" />
  
  <!-- Smiling Mouth -->
  <path d="M265 260 Q300 295 335 260" fill="#ffffff" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" />
</svg>
